# ==========================================================================
# gallery.yml — 首页「照片 + 小诗」仓库
# --------------------------------------------------------------------------
# 一条 = 一张照片 + 一首小诗。首页每次打开随机取一条，点击照片换下一条。
#
# image  照片路径（相对 docs/，建议 4:3 横图，长边 1400px 左右）
# alt    照片的无障碍描述
# poem   小诗，| 后面按行写，最多三到四行为宜
#
# 新增：把照片放进 docs/assets/img/hero/，在下面加一条即可。
# ==========================================================================

- image: assets/img/hero/567d8352c7e1fdb8611f81469d8b4506.jpg
  alt: 塔吊和脚手架
  poem: |
    星期三
    你用脚手架和塔吊挂起感叹号
    拿不下来

- image: assets/img/hero/02.jpg
  alt: 正午的天空与草地
  poem: |
    光落在肩上
    像一句没说出口的话

- image: assets/img/hero/03.jpg
  alt: 黄昏的丘陵
  poem: |
    落日把影子拉长
    傍晚就有了去处

- image: assets/img/hero/04.jpg
  alt: 雨后的阴天
  poem: |
    雨停之后
    玻璃替我记着那场雨

- image: assets/img/hero/05.jpg
  alt: 暮色中的山影
  poem: |
    天色转蓝的那几分钟
    什么都还来得及

- image: assets/img/hero/06.jpg
  alt: 夜里的灯火
  poem: |
    灯一盏一盏亮起
    城市开始小声说话

- image: assets/img/hero/07.jpg
  alt: 海与天的交界
  poem: |
    海把话说完
    就退回很远的地方

- image: assets/img/hero/08.jpg
  alt: 桌上的光斑
  poem: |
    下午三点
    光在桌上停了一会儿
