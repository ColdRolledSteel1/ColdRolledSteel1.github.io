    <div class="page">
      <div class="cols">
        <!-- ============ 左侧导航 ============ -->
        <nav class="side" aria-label="主导航">
          <a class="side__item" href="..">首页</a>

            <section class="view" data-view="guestbook">

              <form class="gb" id="gbForm">

                </label>
                <label class="gb__row">

                  <textarea class="input input--area" id="gbText" name="text" maxlength="500" rows="5" required></textarea>
                </label>
                <div class="gb__actions">
                  <button class="btn" type="submit">提交</button>
                </div>
              </form>

              <div class="gb__bar">
                <button class="linkbtn gb__admin" id="gbAdmin" type="button">管理</button>
              </div>
              <ul class="gb__list" id="gbList"></ul>
            </section>
          </main>
        </div>
      </div>
