      window.__NOVELS__ = [{"html": "\u003cp\u003e\u9547\u4e0a\u7684\u56fe\u4e66\u9986\u6bcf\u5230\u4e0b\u5348\u56db\u70b9\u5c31\u9000\u6f6e\u3002\u4e66\u67b6\u4f1a\u5148\u6d6e\u8d77\u6765\uff0c\u7136\u540e\u6574\u680b\u697c\u6162\u6162\u5f80\u4e0b\u6c89\uff0c\u6c89\u5230\u53ea\u9732\u51fa\u7b2c\u4e8c\u5c42\u7684\u7a97\u3002\u7ba1\u7406\u5458\u8001\u5468\u8bf4\uff0c\u8fd9\u662f\u5f88\u591a\u5e74\u524d\u5c31\u6709\u7684\u89c4\u77e9\uff0c\u6da8\u6f6e\u7684\u65f6\u5019\u8bfb\u4e66\uff0c\u9000\u6f6e\u7684\u65f6\u5019\u6574\u7406\uff0c\u8c01\u4e5f\u522b\u60f3\u4e00\u8fb9\u6652\u592a\u9633\u4e00\u8fb9\u770b\u5c0f\u8bf4\u3002\u003c/p\u003e\n\u003cp\u003e\u6211\u662f\u5728\u7b2c\u4e09\u4e2a\u590f\u5929\u53bb\u501f\u4e66\u7684\u3002\u90a3\u65f6\u6211\u521a\u4e22\u4e86\u5de5\u4f5c\uff0c\u4f4f\u5728\u5916\u5a46\u7559\u4e0b\u7684\u8001\u623f\u5b50\u91cc\uff0c\u767d\u5929\u7761\u89c9\uff0c\u508d\u665a\u51fa\u95e8\u3002\u56fe\u4e66\u9986\u7684\u5730\u677f\u662f\u6728\u5934\u7684\uff0c\u8e29\u4e0a\u53bb\u4f1a\u54cd\uff0c\u54cd\u5f97\u50cf\u6709\u4eba\u5728\u8eab\u540e\u8ddf\u7740\u3002\u6211\u501f\u7684\u7b2c\u4e00\u672c\u4e66\u53eb\u300a\u5982\u4f55\u5ea6\u8fc7\u6f2b\u957f\u7684\u4e0b\u5348\u300b\uff0c\u5c01\u9762\u5df2\u7ecf\u6389\u4e86\u8272\uff0c\u6249\u9875\u4e0a\u6709\u4e00\u884c\u94c5\u7b14\u5b57\uff1a\u8bfb\u8fc7\u4e09\u6b21\uff0c\u4ecd\u7136\u6ca1\u6709\u7b54\u6848\u3002\u003c/p\u003e\n\u003cp\u003e\u8001\u5468\u7ed9\u6211\u5012\u4e86\u4e00\u676f\u6e29\u6c34\uff0c\u8bf4\u8fd9\u672c\u4e66\u5341\u4e03\u5e74\u6ca1\u4eba\u501f\u4e86\u3002\u4ed6\u95ee\u6211\u4e3a\u4ec0\u4e48\u6311\u5b83\uff0c\u6211\u8bf4\u4e0d\u4e0a\u6765\uff0c\u53ea\u662f\u89c9\u5f97\u4e66\u540d\u5f88\u50cf\u5728\u8ddf\u6211\u8bf4\u8bdd\u3002\u4ed6\u70b9\u70b9\u5934\uff0c\u628a\u501f\u4e66\u5361\u7ffb\u5230\u80cc\u9762\uff0c\u7528\u94a2\u7b14\u5199\u4e0a\u6211\u7684\u540d\u5b57\u548c\u65e5\u671f\u3002\u58a8\u6c34\u5728\u7eb8\u4e0a\u6d07\u5f00\u4e00\u5c0f\u56e2\uff0c\u50cf\u4e00\u5c0f\u7247\u6d77\u3002\u003c/p\u003e\n\u003cp\u003e\u540e\u6765\u6211\u51e0\u4e4e\u6bcf\u5929\u90fd\u53bb\u3002\u9000\u6f6e\u7684\u65f6\u5019\u6211\u5750\u5728\u4e8c\u697c\u7a97\u8fb9\uff0c\u770b\u6c34\u9000\u4e0b\u53bb\uff0c\u9732\u51fa\u5e95\u4e0b\u7684\u77f3\u9636\u548c\u4e00\u5c42\u8584\u8584\u7684\u9752\u82d4\u3002\u8001\u5468\u5728\u4e0b\u9762\u6574\u7406\u4e66\uff0c\u5076\u5c14\u62ac\u5934\u558a\u6211\u4e00\u58f0\uff0c\u8ba9\u6211\u628a\u7a97\u5173\u5c0f\u4e00\u70b9\uff0c\u522b\u8ba9\u98ce\u628a\u4e66\u9875\u5439\u4e71\u3002\u6211\u4eec\u5f88\u5c11\u804a\u5929\uff0c\u4f46\u90a3\u79cd\u5b89\u9759\u5f88\u8212\u670d\uff0c\u50cf\u6709\u4eba\u66ff\u4f60\u5b88\u7740\u4e00\u4ef6\u4e8b\u3002\u003c/p\u003e\n\u003cp\u003e\u79cb\u5929\u5feb\u7ed3\u675f\u7684\u65f6\u5019\uff0c\u6211\u5728\u90a3\u672c\u4e66\u7684\u6700\u540e\u4e00\u9875\u5199\u4e0b\uff1a\u7b2c\u56db\u6b21\uff0c\u8fd8\u662f\u6ca1\u6709\u7b54\u6848\uff0c\u4f46\u4e0b\u5348\u53d8\u5f97\u77ed\u4e86\u4e00\u4e9b\u3002\u5199\u5b8c\u6211\u628a\u4e66\u653e\u56de\u539f\u5904\uff0c\u6ca1\u6709\u501f\u8d70\u3002\u7b2c\u4e8c\u5e74\u590f\u5929\u56fe\u4e66\u9986\u642c\u8d70\u4e86\uff0c\u636e\u8bf4\u662f\u56e0\u4e3a\u5730\u57fa\u4e0b\u6c89\u3002\u6211\u53bb\u770b\u8fc7\u4e00\u6b21\uff0c\u53ea\u5269\u4e00\u5757\u6c34\u6ce5\u5730\uff0c\u6652\u5f97\u53d1\u767d\u3002\u003c/p\u003e", "order": 1.0, "title": "\u6f6e\u6c50\u56fe\u4e66\u9986"}, {"html": "\u003cp\u003e\u5341\u4e5d\u5c81\u7684\u80e1\u5e73\u6b63\u52aa\u529b\u5c06\u524d\u53cb\u521a\u751f\u51fa\u7684\u5b69\u5b50\u7528\u9a6c\u6876\u51b2\u8d70\u3002\u4fbf\u79d8\u5341\u5e74\u7684\u7ecf\u9a8c\u8ba9\u4ed6\u81ea\u8ba4\u4e3a\u5f88\u64c5\u957f\u901a\u5395\u6240\uff0c\u4f46\u4ed6\u5ffd\u7565\u4e86\u65b0\u751f\u513f\u4e0d\u662f\u6392\u6cc4\u7269\uff0c\u4e0d\u4f1a\u8f7b\u6613\u88ab\u76ae\u640b\u5b50\u7684\u6c34\u538b\u6253\u7684\u652f\u79bb\u7834\u788e\u3002\u6b64\u523b\u4ed6\u76ef\u7740\u6c34\u91cc\u7684\u8089\u56e2\uff0c\u4ee5\u53ca\u9732\u51fa\u7684\u4e00\u5c0f\u622a\u7c89\u7ea2\u8272\u8110\u5e26\uff0c\u6c14\u4e0d\u6253\u4e00\u5904\u6765\u3002\u53bf\u57ce\u65b0\u533a\u7684\u5c0f\u5bbe\u9986\u91cc\uff0c\u704c\u8fdb\u7a97\u6237\u7684\u6e05\u723d\u7684\u51b7\u91cc\u6cbe\u4e0a\u4e86\u8165\u6c14\u3002\u5973\u53cb\u7ad9\u5728\u4e00\u8fb9\uff0c\u6296\u7684\u50cf\u5e72\u67af\u7684\u6c38\u52a8\u673a\u3002\u003c/p\u003e\n\u003cp\u003e\u80e1\u5e73\u7ed9\u51fa\u91cd\u8981\u6307\u793a\uff1a\u81ea\u5df1\u5148\u8d70\uff0c\u7559\u4e0b\u5973\u53cb\u5904\u7406\u8fd9\u5177\u6216\u8bb8\u8fd8\u6d3b\u7740\u7684\u5c38\u4f53\u3002\u4ed6\u770b\u7740\u5916\u9762\u7684\u9ec4\u53f6\u98d8\u8fdb\u6765\uff0c\u76d6\u5728\u5a74\u513f\u8eab\u4e0a\uff0c\u50cf\u4e00\u5757\u67af\u840e\u7684\u76ae\u80a4\uff0c\u53c8\u50cf\u4e00\u6ee9\u65e9\u5e94\u8be5\u88ab\u51b2\u4e0b\u53bb\u7684\u810f\u7269\u3002\u003c/p\u003e\n\u003cp\u003e\u5bbe\u9986\u5916\u662f\u65b0\u533a\u5927\u9a6c\u8def\uff0c\u4eba\u5c11\uff0c\u662f\u6ca5\u9752\u7684\u8352\u539f\u3002\u53f3\u4fa7\u516c\u56ed\u626d\u66f2\u7684\u6986\u6811\uff0c\u5728\u6a21\u4eff\u53bb\u5e74\u8fd9\u91cc\u6454\u788e\u9acb\u90e8\u7684\u8001\u592a\u592a\u3002\u4ed6\u9a91\u7740\u65ad\u4e86\u4e00\u4fa7\u5239\u8f66\u628a\u7684\u5171\u4eab\u7535\u52a8\u8f66\uff0c\u53bb\u6700\u8fd1\u7684\u5409\u7965\u5929\u5973\u795e\u5e99\u3002\u4e0d\u4e3a\u4e86\u4ec0\u4e48\uff0c\u53ea\u662f\u56e0\u4e3a\u540d\u5b57\u5f88\u597d\u542c\u3002\u003c/p\u003e\n\u003cp\u003e\u508d\u665a\u4e0b\u96e8\u524d\u7684\u53bf\u57ce\uff0c\u6ce1\u5728\u6ee1\u662f\u7070\u5c18\u548c\u6f6e\u6c14\u7684\u3001\u770b\u4e0d\u89c1\u7684\u6c34\u91cc\u3002\u6e38\u8fc7\u62c9\u6c99\u77f3\u7684\u5927\u8f66\uff0c\u8f70\u9e23\u7740\uff0c\u50cf\u53d1\u60c5\u7684\u5de8\u5927\u62b9\u9999\u9cb8\u3002\u8fdc\u5904\uff0c\u5409\u7965\u5929\u5973\u795e\u5e99\u6726\u80e7\uff0c\u98d8\u8d77\u7684\u7ecf\u5e61\u4e0e\u9694\u58c1\u4e2d\u5b66\u7684\u6821\u5fbd\u878d\u4e3a\u4e00\u4f53\u3002\u6614\u65e5\u653f\u6559\u5408\u4e00\u7684\u5c0f\u53bf\u57ce\uff0c\u795e\u5e99\u3001\u5b66\u6821\u3001\u5546\u4e1a\u8857\u7ec4\u6210\u4e86\u7578\u5f62\u7684\u8fde\u4f53\u4eba\uff0c\u5587\u561b\u548c\u5b66\u751f\u4e89\u62a2\u4e2d\u5fc3\u5e7f\u64ad\u7684\u5f52\u5c5e\uff0c\u7535\u5b50\u4f5b\u7ecf\u5636\u54d1\u5730\u8d85\u5ea6\u7740\u8fdb\u524d\u4f73\u5927\u578b\u8d85\u5e02\uff0c\u548c\u8870\u843d\u7684\u3001\u73b0\u5728\u53ea\u5356\u68c9\u88e4\u7684\u8499\u5a01\u96c6\u56e2\u5546\u573a\u5927\u697c\u3002\u6076\u52a3\u5929\u6c14\u524d\u7684\u660f\u9ec4\u3002\u5982\u4e34\u672b\u4e16\u7684\u83dc\u5e02\u573a\u3002\u003c/p\u003e\n\u003cp\u003e\u80e1\u5e73\u548c\u95e8\u53e3\u7684\u77f3\u5934\u72ee\u5b50\u5750\u5728\u4e00\u8d77\uff0c\u5f00\u59cb\u5c3d\u529b\u8ba9\u81ea\u5df1\u5bb3\u6015\u3002\u5b69\u5b50\u662f\u4ec0\u4e48\u65f6\u5019\u6709\u7684\uff1f\u4ed6\u95ed\u4e0a\u773c\u775b\uff1a\u6cf0\u5b89\u7684\u57ce\u4e2d\u6751\uff0c\u4ea4\u9519\u7684\u7535\u7ebf\uff0c\u767d\u683c\u5b50\u5e03\u6ee1\u9ed1\u9ec4\u8272\u6c34\u75d5\u7684\u5efa\u7b51\u5916\u5899\uff0c\u4ed6\u5728\u4e94\u5341\u5757\u94b1\u4e00\u665a\u7684\u5c0f\u623f\u95f4\u91cc\u4e0e\u5973\u53cb\u4ea4\u5c3e\uff0c\u4f3c\u4e4b\u524d\u628a\u4ed6\u541e\u5165\u8179\u4e2d\u7684\u3001\u87d2\u86c7\u822c\u7684\u7eff\u76ae\u706b\u8f66\u3002\u5973\u53cb\u68d5\u9ec4\u8272\u7684\u88f8\u4f53\u6296\u7684\u50cf\u7ed9\u835e\u9ea6\u76ae\u53bb\u6742\u8d28\u7684\u632f\u52a8\u7b5b\u3002\u80e1\u5e73\u8bb0\u5f97\u9f99\u738b\u5e99\u6751\u6709\u4e00\u53f0\u8fd9\u6837\u7684\u673a\u5668\uff0c\u4e00\u95f4\u74e6\u623f\u91cc\uff0c\u767d\u7eff\u8272\u7684\u3001\u8f70\u9e23\u7740\u7684\uff0c\u76ae\u5e26\u548c\u94a2\u94c1\u7f20\u6210\u7684\u5de5\u4e1a\u5316\u7b4b\u8089\u3002\u4eba\u4eec\u5728\u4e5d\u5341\u516d\u5206\u8d1d\u7684\u623f\u95f4\u91cc\uff0c\u7b49\u5f85\u673a\u5668\u5455\u51fa\u5e72\u51c0\u7684\u835e\u9ea6\u76ae\uff0c\u586b\u5145\u8fdb\u7f1d\u597d\u7684\u6795\u5934\u5957\u91cc\u3002\u8fd9\u79cd\u6795\u5934\u662f\u6700\u8212\u670d\u7684\uff0c\u81f3\u5c11\u80e1\u5e73\u8fd9\u4e48\u8ba4\u4e3a\u3002\u003c/p\u003e\n\u003cp\u003e\u548c\u77f3\u72ee\u5b50\u82e6\u601d\u51a5\u60f3\u5230\u516d\u70b9\u4e09\u5341\u516b\u5206\uff0c\u80e1\u5e73\u53d1\u73b0\u8111\u5b50\u91cc\u5b9e\u5728\u6ca1\u6709\u4ec0\u4e48\u53ef\u4ee5\u62c5\u5fc3\u7684\uff0c\u968f\u540e\u53d1\u73b0\u8fc7\u4e86\u5bfa\u5e99\u7684\u8425\u4e1a\u65f6\u95f4\uff0c\u9042\u5174\u594b\u4e8e\u7701\u4e0b\u4e86\u4e8c\u5341\u4e94\u5757\u95e8\u7968\u94b1\u3002\u4ed6\u4ece\u57ce\u5899\u7684\u88c2\u7f1d\u94bb\u8fdb\u53bb\uff0c\u8d70\u5e03\u6ee1\u9ed1\u732b\u3001\u548c\u9644\u8fd1\u4eba\u5bb6\u62ff\u7c73\u9762\u7cae\u6cb9\u4f9b\u5949\u4e4b\u5c0f\u5076\u50cf\u7684\u677e\u6797\u5c0f\u8def\u3002\u98ce\u9a6c\u7eb8\u94fa\u6210\u7684\u5f69\u8272\u5730\u677f\uff0c\u80e1\u5e73\u8e29\u5728\u4e0a\u9762\uff0c\u6cf5\u51fa\u51e0\u4ebf\u58f0\u75db\u82e6\u7684\u795d\u798f\u3002\u4ed6\u722c\u5230\u704c\u6728\u4e1b\uff0c\u722c\u5230\u65ad\u9996\u7684\u77f3\u96d5\uff0c\u6700\u7ec8\u6765\u5230\u7167\u58c1\u548c\u5c71\u95e8\u4e4b\u95f4\u7684\u67e5\u739b\u821e\u573a\u3002\u003c/p\u003e\n\u003cp\u003e\u4ed6\u8df3\u5b89\u4ee3\u821e\u3002\u53e4\u8001\u7684\u3001\u6cbb\u7597\u8499\u53e4\u738b\u516c\u5973\u513f\u7ecf\u524d\u70e6\u8e81\u969c\u788d\u7684\u821e\u8e48\uff0c\u878d\u5408\u4e86\u4e8c\u5341\u4e00\u4e16\u7eaa\u7684\u6821\u56ed\u98ce\u683c\uff0c\u5e26\u7740\u5409\u5c3c\u65af\u4e16\u754c\u8bb0\u5f55\u7684\u73b0\u4ee3\u88c5\u7532\uff0c\u8ba9\u67e5\u739b\u821e\u573a\u56de\u5149\u8fd4\u7167\u3002\u5bf9\u4e8e\u80e1\u5e73\u6765\u8bf4\uff0c\u8fd9\u662f\u5c0f\u5b66\u65f6\u7684\u8bfe\u95f4\u64cd\uff0c\u6325\u8d77\u7ea2\u7ef8\u65f6\uff0c\u80fd\u8ba9\u4eba\u60f3\u8d77\u653e\u5b66\u540e\u653e\u5728\u5634\u91cc\u5438\u7684\u3001\u8def\u8fb9\u7eff\u5316\u5e26\u91cc\u7684\u4e00\u4e32\u7ea2\u3002\u6c72\u6ee1\u6765\u5f80\u8f66\u8f86\u5c3e\u6c14\u548c\u5421\u866b\u5549\u4e4b\u5507\u5f62\u82b1\u6735\uff0c\u543b\u4e0a\u53bb\u53ef\u4ee5\u5c1d\u5230\u88ab\u5316\u5de5\u548c\u673a\u68b0\u5f3a\u5978\u7684\u751c\u82b1\u871c\u3002\u4e8e\u662f\u4ed6\u7ee7\u7eed\u8df3\u821e\uff0c\u6ca1\u5728\u610f\u5929\u8272\uff0c\u5c06\u843d\u7684\u96e8\uff0c\u548c\u5174\u6e90\u5bfa\u5e9f\u5f03\u949f\u9f13\u697c\u53d1\u51fa\u7684\uff0c\u4eba\u4e4b\u5c06\u6b7b\u5374\u9aa4\u7136\u590d\u6d3b\u7684\u54c0\u9e23\u3002\u003c/p\u003e\n\u003cp\u003e\u5373\u4f7f\u50cf\u80e1\u5e73\u4e00\u6837\u7684\u4eba\u7269\uff0c\u5bf9\u4e8e\u4e00\u52a0\u4e00\u7b49\u4e8e\u4e8c\u8fd9\u7c7b\u81ea\u7136\u89c4\u5f8b\uff0c\u8fd8\u662f\u6709\u4e9b\u656c\u754f\u7684\u3002\u6240\u4ee5\uff0c\u5f53\u821e\u573a\u7740\u6025\u706b\u71ce\u5730\u5411\u5916\u62d3\u5c55\uff0c\u50cf\u53d1\u9ad8\u70e7\u5927\u8111\u4e2d\u6495\u626f\u81a8\u80c0\u7684\u571f\u5730\u65f6\uff0c\u4ed6\u7684\u65b0\u5947\u611f\u4e2d\u6df7\u6742\u4e86\u4e0d\u89e3\u3002\u7070\u5c18\u548c\u6e7f\u6c14\u6d88\u6563\u65f6\uff0c\u4e0d\u77e5\u662f\u6e05\u6668\u8fd8\u662f\u9ec4\u660f\u7684\u6a59\u9ec4\u6e10\u53d8\u8272\uff0c\u4ea4\u754c\u7ebf\u4e4b\u4e0b\u5168\u9ed1\u7684\u8352\u539f\u3002\u795e\u5dde\u4e94\u53f7\u964d\u843d\u573a\uff1f\u80e1\u5e73\u7684\u4e00\u5207\u8bb0\u5fc6\u4e2d\uff0c\u8fd9\u662f\u552f\u4e00\u4e0e\u5f53\u4e0b\u7684\u573a\u666f\u76f8\u4f3c\u7684\u3002\u60e8\u767d\u8272\u7684\u4e0d\u660e\u98de\u884c\u7269\uff0c\u7838\u5411\u4e5d\u4e5d\u516b\u5341\u4e00\u95f4\u5927\u6bbf\u524d\u7684\u725b\u8089\u5e72\u4e00\u6761\u8857\u3002\u80e1\u5e73\u6b64\u65f6\u7ed3\u675f\u4e86\u8fd1\u5c0f\u8fdc\u5927\u7684\u9ad8\u70e7\uff0c\u9a91\u4e0a\u6ca1\u6709\u5239\u8f66\u7684\u5171\u4eab\u7535\u52a8\u8f66\u8d76\u5f80\u5760\u843d\u73b0\u573a\u3002\u6454\u6210\u6b8b\u75be\u7684\u5706\u76d8\u98de\u884c\u7269\u788e\u6210\u4e00\u6735\u83b2\u82b1\uff0c\u94a2\u7b4b\u7a81\u5140\u7684\u82b1\u74e3\uff0c\u62b1\u7740\u9ed1\u6f06\u76ae\u80a4\u7684\u5c11\u5973\u3002\u5c11\u5973\u81ea\u79f0\u9aa1\u5b50\u5929\u738b\uff0c\u751f\u4e8e\u4ed9\u5973\u661f\u5ea7\u3002\u80e1\u5e73\u5927\u7b11\uff0c\u8fd9\u4f1a\u662f\u7ecf\u5178\u7684\u5eb8\u4fd7\u79d1\u5e7b\u7247\u5267\u60c5\uff0c\u5e2e\u52a9\u5931\u8db3\u5760\u843d\u7684\u5916\u661f\u7f8e\u4eba\u513f\u627e\u9f50\u98de\u8239\u96f6\u4ef6\uff0c\u7b49\u5979\u518d\u56de\u6765\u5c31\u80fd\u62b1\u5f97\u7f8e\u4eba\u5f52\uff01\u4e8b\u4e0d\u5b9c\u8fdf\uff0c\u8d76\u5feb\u5f00\u59cb\uff0c\u80e1\u5e73\u53ea\u9057\u61be\uff0c\u6ca1\u6709\u6444\u50cf\u673a\u8bb0\u5f55\u81ea\u5df1\u7684\u4e30\u529f\u4f1f\u7ee9\u3002\u003c/p\u003e\n\u003cp\u003e\u201c\u53bb\u627e\u4eba\u9aa8\u7684\u5ff5\u73e0\u5427\uff01\u201d\u003c/p\u003e\n\u003cp\u003e\u8fd9\u4e2a\u597d\u529e\uff0c\u80e1\u5e73\u60f3\u3002\u8001\u6728\u5320\u59d3\u5305\uff0c\u5e74\u82b3\u516d\u516b\uff0c\u4f4f\u767e\u59d3\u4eba\u5bb6\uff0c\u80e1\u5e73\u5bf9\u95e8\u3002\u5c0f\u7f8a\u7f94\u817f\u9aa8\u97ad\uff0c\u732a\u7684\u8ddd\u9aa8\u73a9\u5177\uff0c\u4ed6\u5bb6\u662f\u9aa8\u5934\u7684\u9648\u5217\u9986\u3002\u4ed6\u6572\u4e86\u95e8\uff0c\u7528\u6469\u65af\u7535\u7801\uff0c\u518d\u7528\u51ef\u6492\u5bc6\u7801\u52a0\u5bc6\uff0c\u518d\u628a\u62fc\u97f3\u6362\u6210\u82f1\u6587\uff0c\u518d\u5b83\u4eec\u53d8\u6210\u65e0\u89c4\u5f8b\u7684\u5927\u5199\u610f\u7684\u6572\u51fb\u3002\u6ca1\u6709\u4eba\u5f00\u95e8\u3002\u8001\u6728\u5320\u5728\u5f00\u53d1\u533a\u7684\u76d1\u72f1\uff0c\u53bb\u5e74\u7684\u4eca\u5929\u4ed6\u5e26\u4e0a\u4e86\u65a7\u5934\uff0c\u5728\u6986\u6811\u6797\u5b50\u91cc\uff0c\u780d\u4e86\u81ea\u5df1\u76f8\u7231\u4e8c\u5341\u5e74\u7684\u5ab3\u5987\u3002\u80e1\u5e73\u89c9\u5f97\u5305\u6728\u5320\u53ea\u662f\u60f3\u5e2e\u59bb\u5b50\u4e0b\u5782\u7684\u8116\u5b50\u9489\u4e00\u4e2a\u6954\u5b50\u52a0\u56fa\uff0c\u5374\u758f\u5ffd\u4e86\u6b62\u8840\u7684\u5de5\u4e1a\u6d41\u7a0b\u3002\u4ed6\u53bb\u63a2\u76d1\uff0c\u5077\u4e86\u6728\u5320\u59bb\u5b50\u7b7e\u7684\u8c05\u89e3\u4e66\uff0c\u987a\u4fbf\u5e26\u8d70\u4e86\u9576\u5728\u6728\u6954\u5b50\u4e0a\u4e03\u8282\u9888\u690e\u9aa8\u3002\u521a\u597d\u56f4\u5728\u9ed1\u8272\u5c11\u5973\u7684\u8116\u5b50\u4e0a\u3002\u201c\u6211\u82e5\u89c1\u6709\u82fe\u520d\u82fe\u520d\u5c3c\u90ac\u6ce2\u7d22\u8fe6\u90ac\u6ce2\u65af\u8fe6\u3002\u201d\u5979\u8bf4\u3002\u5979\u7684\u7b11\u50cf\u540a\u5170\u3002\u003c/p\u003e\n\u003cp\u003e\u201c\u53bb\u627e\u809a\u8110\u4e0a\u7684\u592a\u9633\u5427\uff01\u201d\u003c/p\u003e\n\u003cp\u003e\u8fd9\u4e2a\u597d\u529e\uff0c\u80e1\u5e73\u60f3\u3002\u7f51\u7ea2\u5927\u6865\uff0c\u53bf\u57ce\u65b0\u65f6\u4ee3\u91cd\u8981\u5de5\u7a0b\u4e4b\u4e00\uff0c\u5f15\u65e0\u6570\u5fd7\u58eb\u4ec1\u4eba\u524d\u6765\u89c2\u6469\uff0c\u6709\u6548\u4fc3\u8fdb\u4e13\u4e1a\u5316\u521b\u9020\u8005\u7ecf\u6d4e\u53d1\u5c55\uff0c\u73b0\u5df2\u6210\u4e3a\u63a8\u52a8\u5c45\u6c11\u53ca\u5916\u5730\u6e38\u5ba2\u81ea\u6740\u4fbf\u5229\u5316\u7684\u6709\u6548\u8bbe\u65bd\u3002\u4e00\u71d5\u8d75\u4eba\u58eb\uff0c\u9ad8\u77e5\u5206\u5b50\uff0c\u6765\u8bbf\u6b64\u5904\uff0c\u524d\u5f80\u4e0b\u67f3\u6811\u8425\u5b50\u5bfb\u627e\u7f51\u7edc\u4e0a\u6731\u4e3d\u53f6\u822c\u7684\u7231\u4eba\uff0c\u5f52\u6765\u540e\u5374\u6267\u7740\u4e8e\u8df3\u8fdb\u4e0d\u5954\u817e\u7684\u517b\u84c4\u7267\u6cb3\u5927\u5ce1\u8c37\u3002\u9664\u53bb\u7b2c\u4e09\u4e2d\u5b66\u6709\u5929\u624d\u5973\u513f\u7684\u7cbe\u795e\u75c5\u4e3b\u4efb\uff0c\u4e0e\u53ea\u6709\u4e24\u95f4\u74e6\u623f\u7684\u9489\u5b50\u6237\u57ce\u5e02\u7f8e\u5316\u6709\u9650\u516c\u53f8\u8001\u677f\uff0c\u4ed6\u4e00\u5b9a\u662f\u53bf\u57ce\u6700\u667a\u6167\u7684\uff0c\u809a\u8110\u4e0a\u7684\u592a\u9633\u6700\u4eae\u7684\u3002\u6eda\u4e0b\u4e5d\u5341\u5ea6\u89d2\u7684\u5927\u575d\uff0c\u4e00\u5398\u7c73\u5bbd\u7684\u53f0\u9636\uff0c\u80e1\u5e73\u548c\u5c11\u5973\u6ca1\u627e\u5230\u5c38\u4f53\uff0c\u53ea\u6709\u6cb3\u6ee9\u4e0a\u8b66\u5bdf\u753b\u7684\u767d\u8272\u4eba\u5f62\u8f6e\u5ed3\u3002\u7a76\u7adf\u662f\u4eba\u6027\u7684\u626d\u66f2\uff0c\u8fd8\u662f\u9053\u5fb7\u7684\u6ca6\u4e27\uff1f\u54df\uff0c\u767d\u80a1\u957f\uff0c\u53c8\u5728\u8fd9\u905b\u5f2f\u513f\uff1f\u522b\u5728\u6cb3\u6ee9\u4e0a\u627e\u7389\u77f3\u80da\u5b50\u4e86\uff0c\u8fd9\u513f\u90fd\u662f\u7816\u5934\u6599\uff01\u5965\uff0c\u539f\u6765\u4f60\u7684\u513f\u5b50\u4e5f\u5728\u8fd9\u513f\u8df3\u5566\uff1f\u5927\u5b66\u6bd5\u4e1a\uff0c\u5de5\u4f5c\u7f8e\u597d\uff0c\u70ed\u95f9\u7684\u670b\u53cb\u805a\u4f1a\u4e4b\u540e\u5728\u8fd9\u513f\u4e00\u8dc3\u800c\u4e0b\u2026\u2026\u80e1\u5e73\u5728\u6b7b\u53bb\u7684\u524d\u5927\u5b66\u751f\u809a\u8110\u4e0a\u627e\u5230\u4e86\u592a\u9633\u3002\u767d\u80a1\u957f\u4e3a\u5565\u54ed\u4e86\uff1f\u53ef\u80fd\u4ed6\u4e00\u751f\u90fd\u6ca1\u627e\u5230\u8fd9\u4e48\u6d53\u9633\u6b63\u548c\u7684\u7fe1\u7fe0\u5427\uff01\u003c/p\u003e\n\u003cp\u003e\u201c\u53bb\u627e\u4eb2\u751f\u513f\u5b50\u7684\u76ae\u5427\uff01\u201d\u003c/p\u003e\n\u003cp\u003e\u597d\u627e\uff0c\u8fd9\u66f4\u597d\u627e\u3002\u62e8\u901a\u5973\u53cb\u7684\u7535\u8bdd\uff0c\u95ee\u95ee\u5979\u5728\u54ea\u91cc\u5904\u7406\u7684\u5a74\u5b69\uff0c\u7535\u8bdd\u94c3\u5374\u5728\u8eab\u8fb9\u54cd\u3002\u7ea2\u65d7\u5e7f\u573a\uff0c\u6bcf\u9022\u4e8c\u56db\u516d\u5c31\u5173\u95e8\u7684\u516c\u5171\u5395\u6240\uff0c\u6bcf\u4e2a\u5751\u4f4d\u53ea\u6709\u4e00\u5e73\u65b9\u3002\u80e1\u5e73\u6ca1\u6709\u7740\u6025\uff0c\u773c\u4e0b\u4eba\u6b63\u591a\uff0c\u5c0f\u996d\u684c\u7684\u4e1a\u4f59\u8001\u5e08\u8d76\u7740\u5b66\u751f\u7f8a\u7fa4\uff0c\u56de\u8001\u5c0f\u533a\u7684\u94c1\u5236\u4e0a\u4e0b\u94fa\u5199\u4f5c\u4e1a\u3002\u7b49\u597d\u5947\u7684\u773c\u775b\u5c11\u4e86\uff0c\u591c\u5e02\u7684\u644a\u4f4d\u591a\u4e86\uff0c\u5927\u706f\u7403\u5f00\u59cb\u7167\u5927\u7406\u77f3\u8349\u539f\u4e0a\u7684\u5de8\u5927\u6c34\u6ce5\u52d2\u52d2\u8f66\u96d5\u5851\u65f6\uff0c\u80e1\u5e73\u548c\u5c11\u5973\u53bb\u638f\u5a74\u513f\u3002\u9996\u5148\u51fa\u6765\u7684\u662f\u67af\u53f6\u4e00\u6837\u7684\u76ae\u80a4\uff0c\u968f\u540e\u662f\u5149\u6ed1\u7684\u91d1\u9ec4\u6811\u53f6\uff0c\u51e0\u5e74\u524d\u5973\u53cb\u559c\u6b22\u5199\u8bd7\u65f6\uff0c\u7ecf\u5e38\u5728\u552f\u7f8e\u96ea\u4eba\u5c01\u9762\u7684\u7b14\u8bb0\u672c\u91cc\u5939\u7684\u90a3\u79cd\u3002\u4ed6\u4eec\u5bf9\u76ae\u8fdb\u884c\u4e09\u55ea\u4ecb\u5bfc\u96f6\u957f\u5ea6\u4ea4\u8054\u97a3\u5236\u52a0\u5de5\uff0c\u53d8\u6210\u5c11\u5973\u7684\u5916\u8863\u3002\u80e1\u5e73\u7b2c\u4e00\u6b21\u53d1\u73b0\u9aa1\u5b50\u5929\u738b\u548c\u81ea\u5df1\u7684\u5973\u53cb\u957f\u5f97\u5982\u6b64\u76f8\u50cf\uff0c\u53ea\u662f\u80a4\u8272\u7684\u5dee\u5f02\u2014\u2014\u6216\u8bb8\u4e5f\u53ea\u662f\u5929\u8272\u7684\u5dee\u5f02\u5427\u3002\u003c/p\u003e\n\u003cp\u003e\u201c\u6700\u540e\uff0c\u53bb\u627e\u76db\u6ee1\u9c9c\u8840\u7684\u4eba\u5934\u9aa8\u7897\u5427\uff01\u201d\u003c/p\u003e\n\u003cp\u003e\u8fd9\u4e2a\u4e0d\u884c\u3002\u80e1\u5e73\u4e25\u8bcd\u62d2\u7edd\u3002\u6587\u660e\u793e\u4f1a\uff0c\u4e0d\u5e94\u518d\u6709\u5982\u6b64\u8840\u8165\u7684\u5c01\u5efa\u6cd5\u5668\uff1b\u6cd5\u6cbb\u65f6\u4ee3\uff0c\u7edd\u4e0d\u5bb9\u90aa\u6559\u518d\u6b21\u4fb5\u5bb3\u513f\u7ae5\uff01\u597d\u5427\uff0c\u5c11\u5973\u53f9\u6c14\uff0c\u90a3\u5c31\u53bb\u90ca\u533a\u7684\u4e94\u661f\u6c34\u5e93\uff0c\u627e\u6700\u540e\u4e00\u4e2a\u4fe1\u7269\u5427\uff01\u003c/p\u003e\n\u003cp\u003e\u90a3\u91cc\uff0c\u65f6\u95f4\u662f\u590f\u5929\uff0c\u4f46\u65e9\u4e0a\u6709\u96fe\u3002\u6587\u9769\u65f6\u671f\u7684\u8001\u6c34\u5e93\uff0c\u892a\u8272\u7684\u6807\u8bed\u8fd8\u5728\u8fdb\u6c34\u5854\u4e0a\u5f20\u7259\u821e\u722a\u5730\u5e26\u7740\u7ea2\u3002\u662f\u8c01\u5728\u65e9\u4e0a\u4e03\u70b9\u96f6\u4e94\u5206\uff0c\u7ad9\u5728\u72ed\u7a84\u7684\u5206\u6c34\u5899\u4e0a\uff1f\u8d35\u59d3\u5510\uff0c\u80e1\u5e73\u7684\u521d\u4e2d\u540c\u5b66\u3002\u9a74\u80cc\u8702\u8170\u8c61\u817f\uff0c\u50cf\u201cH\u201d\u5f62\u7684\u54d1\u94c3\u3002\u5907\u53d7\u77a9\u76ee\u7684\u5510\uff0c\u4e07\u4f17\u77a9\u76ee\u7684\u5510\uff0c\u63a5\u7eb3\u5916\u5730\u7684\u80e1\u5e73\u4e8e\u98df\u5802\u65c1\u8fb9\u7684\u9505\u7089\u623f\u3002\u6148\u7709\u5584\u76ee\uff0c\u548c\u853c\u53ef\u4eb2\uff0c\u4ed6\u7ed9\u80e1\u5e73\u5403\u5269\u7684\u65b9\u4fbf\u9762\u8c03\u6599\u5305\uff0c\u8ba9\u4ed6\u5728\u665a\u4e0a\u8865\u5145\u76d0\u5206\uff0c\u50cf\u8214\u7816\u7684\u5ca9\u7f8a\u3002\u653e\u5047\u7684\u6821\u8f66\u629b\u951a\uff0c\u8f66\u4e0a\u65e0\u804a\u7684\u4eba\u5fc3\u60f6\u60f6\uff0c\u4f1f\u5927\u7684\u5510\u6307\u660e\u672a\u6765\u7684\u65b9\u5411\uff1a\u5c0f\u80e1\uff0c\u4f60\u77e5\u9053\u5417\uff0c\u4f60\u8737\u7f29\u8d77\u6765\u7279\u522b\u663e\u5c0f\uff0c\u88f9\u4e0a\u6ce5\u5c31\u80fd\u5f53\u76ae\u7403\u73a9\u5566\uff01\u80e1\u5e73\u5728\u65cb\u8f6c\u4e2d\u611f\u53d7\u5230\u65e0\u6570\u53ea\u624b\uff0c\u5176\u4e2d\u6709\u5510\u9e70\u722a\u4e00\u6837\u7684\u624b\uff0c\u5728\u7c97\u66b4\u62c9\u626f\u7684\u540c\u65f6\u7ec6\u7ec6\u63c9\u6413\uff0c\u80e1\u5e73\u5e72\u7626\u7684\u8eab\u4f53\u5728\u75db\u82e6\u4e2d\u6d8c\u51fa\u6e05\u6cc9\u2026\u2026\u003c/p\u003e\n\u003cp\u003e\u4e8e\u662f\uff0c\u590f\u5929\u7684\u6e05\u6668\uff0c\u65e9\u4e0a\u4e03\u70b9\u96f6\u4e94\u5206\uff0c\u80e1\u5e73\u771f\u8bda\u8654\u8bda\u5730\u628a\u5510\u63a8\u8fdb\u5927\u6cb3\u3002\u8fd9\u53ea\u662f\u5931\u8db3\u6389\u843d\uff1a\u72ed\u7a84\u7684\u5206\u6c34\u5899\uff0c\u5b09\u620f\u7684\u5e74\u8f7b\u4eba\uff0c\u662f\u610f\u5916\u53d1\u751f\u65e0\u9700\u591a\u8a00\u7684\u4e24\u8981\u7d20\u3002\u5728\u4e0b\u6e38\uff0c\u80e1\u5e73\u548c\u5c11\u5973\u627e\u5230\u88ab\u51b2\u7684\u50cf\u9e45\u5375\u77f3\u7684\u5934\u9aa8\u3002\u4e07\u4e8b\u4ff1\u5907\uff0c\u5c11\u5973\u8bf4\uff0c\u8ba9\u6211\u4eec\u628a\u5b83\u96d5\u6210\u9aa8\u7897\uff0c\u6cfc\u6d12\u5e78\u798f\uff01\u003c/p\u003e\n\u003cp\u003e\u94e1\u3001\u933e\u3001\u8f67\u3001\u78e8\u3001\u52fe\u3001\u5212\uff0c\u5982\u4f55\u624d\u80fd\u505a\u51fa\u5f62\u72b6\uff1f\u655e\u53e3\u3001\u76f4\u53e3\u3001\u655b\u53e3\u7897\uff0c\u54ea\u4e00\u4e2a\u624d\u80fd\u6cfc\u6d12\u51fa\u5e78\u798f\uff1f\u8d8a\u6765\u8d8a\u8584\u7684\u7897\u58c1\uff0c\u6700\u7ec8\u53d1\u51fa\u65ad\u88c2\u7684\u547b\u541f\u3002\u552f\u4e00\u7684\u539f\u6750\u6599\u6ca1\u4e86\uff0c\u5c11\u5973\u6012\u53d1\u51b2\u51a0\uff0c\u9752\u9762\u7360\u7259\uff0c\u5750\u4e0b\u7684\u9aa1\u5b50\u4fa7\u9762\u751f\u51fa\u53cc\u76ee\u3002\u5979\u8bf4\uff1a\u4f60\u662f\u73b0\u5728\u6700\u5e78\u798f\u7684\u4eba\uff0c\u62ff\u4f60\u7684\u5934\u9aa8\u505a\u65b0\u7684\u539f\u6750\u6599\u5427\uff01\u003c/p\u003e\n\u003cp\u003e\u80e1\u5e73\u4e0d\u89e3\uff1a\u4e3a\u4ec0\u4e48\u6211\u662f\u5f53\u4eca\u6700\u5e78\u798f\u7684\uff1f\u59d3\u80e1\u540d\u5e73\uff0c\u7956\u7c4d\u5c71\u4e1c\uff0c\u9f20\u76ee\u72fc\u58f0\uff0c\u70e8\u7136\u82e5\u51e1\u4eba\u3002\u5750\u5728\u516d\u5c81\u65f6\u53bb\u9547\u533b\u9662\u6253\u70b9\u6ef4\u7684\u8f66\u4e0a\uff0c\u5bb3\u6015\u5b97\u6559\u3002\u6e29\u67d4\u7684\u6bcd\u4eb2\u4e0d\u5531\u6447\u7bee\u66f2\uff0c\u8bb2\u9694\u58c1\u6751\u7537\u4eba\u6740\u6b7b\u59bb\u5b50\u5cb3\u7236\u5cb3\u6bcd\u7684\u5927\u5c60\u6740\u3002\u8bb2\u65d7\u516c\u5b89\u5c40\u6392\u957f\u961f\uff0c\u53d1\u9f50\u8a93\uff0c\u7acb\u5947\u5fd7\uff0c\u8c31\u65b0\u8bd7\uff01\u5f53\u665a\u5728\u5c71\u8170\u7684\u72d7\u718a\u6d1e\u62d6\u51fa\u51f6\u624b\u7684\u54c0\u568e\u3002\u5927\u5bb6\u559c\u6b22\u8c08\u8840\u6848\uff0c\u8981\u538b\u4f4e\u55d3\u5b50\uff0c\u5e26\u7740\u4e25\u8083\uff0c\u611f\u6168\u793e\u4f1a\uff0c\u540c\u60c5\u53d7\u5bb3\u8005\uff0c\u628a\u8fd9\u4e00\u5957\u5728\u5404\u5904\u91cd\u590d\uff0c\u50cf\u65e0\u9650\u91cd\u590d\u540c\u4e00\u5929\u7684\u65b0\u95fb\u8054\u64ad\u3002\u65e0\u6570\u4e2a\u51f6\u624b\uff0c\u65e0\u6570\u4e2a\u626d\u6210\u6f29\u6da1\u7684\uff0c\u6df1\u4e0d\u89c1\u5e95\u7684\u60f3\u6cd5\uff0c\u5728\u4f17\u53e3\u94c4\u91d1\u4e2d\u6210\u4e3a\u65e0\u610f\u4e49\u7684\u6492\u6cfc\u3002\u4e8e\u662f\uff0c\u6ca6\u4e3a\u65e0\u610f\u4e49\u7684\u9c9c\u8840\uff0c\u878d\u8fdb\u571f\u5730\uff0c\u624d\u80fd\u957f\u51fa\u4e0d\u7528\u601d\u8003\u610f\u4e49\u7684\u5e78\u798f\u3002\u80e1\u5e73\u4f69\u670d\u81ea\u5df1\uff0c\u53ef\u6bd4\u9633\u660e\u5148\u751f\u9f99\u573a\u609f\u9053\uff0c\u5927\u609f\u683c\u7269\u81f4\u77e5\u4e4b\u65e8\uff0c\u4e8e\u662f\u6cbe\u4e86\u51e0\u6761\u4eba\u547d\uff0c\u9042\u6210\u4e00\u4ee3\u67ad\u96c4\u3002\u4ed6\u611f\u8c22\u5c11\u5973\u2014\u2014\u9aa1\u5b50\u5929\u738b\uff0c\u8fd9\u6b63\u662f\u4ed6\u59cb\u7ec8\u8ffd\u6c42\u7684\u3001\u65e0\u610f\u4e49\u7684\u6b7b\u4ea1\uff01\u003c/p\u003e\n\u003cp\u003e\u4eca\u591c\u75db\u5feb\uff01\u80e1\u5e73\u6709\u4e9b\u5947\u602a\uff0c\u4e3a\u4ec0\u4e48\u6298\u817e\u4e00\u591c\uff0c\u515c\u515c\u8f6c\u8f6c\uff0c\u773c\u524d\u8fd8\u662f\u67e5\u739b\u821e\u573a\uff0c\u8f6c\u8eab\u4e4b\u540e\uff0c\u8fd8\u662f\u5bfa\u5e99\u91cc\u6b22\u5a31\u8083\u7a46\u7684\u5f25\u52d2\u6bbf\u3002\u773c\u524d\u7684\u5c11\u5973\u53d8\u767d\u4e86\uff0c\u6ca1\u4e86\u516d\u6761\u80f3\u818a\u548c\u56db\u773c\u9aa1\u5b50\uff0c\u8d70\u5411\u4e86\u53ea\u62ff\u7740\u624b\u7535\u7b52\u548c\u7ef3\u5b50\u7684\u73b0\u4ee3\u5316\u3002\u80e1\u5e73\u63a5\u8fc7\u7ef3\u5b50\uff0c\u51b3\u5b9a\u81f4\u656c\u5728\u52a8\u8361\u4e2d\u968f\u5fc3\u6240\u6b32\u4e0a\u540a\u7684\u672d\u8428\u514b\u8fbe\u638c\u5370\u5587\u561b\u963f\u514b\u65fa\u5df4\u52d2\u4e39\uff0c\u4f46\u4ed6\u5fd8\u4e86\u81ea\u5df1\u4e0d\u4f1a\u7cfb\u7ede\u5211\u540a\u7269\u7ed3\uff0c\u53ea\u80fd\u5c06\u7ef3\u5b50\u6254\u8fc7\u623f\u6881\uff0c\u7cfb\u6210\u4e00\u4e2a\u5927\u73af\u3002\u80e1\u5e73\u5728\u628a\u8116\u5b50\u5957\u4e0a\u7ef3\u7d22\u7684\u77ac\u95f4\u60f3\u5230\u4e86\u5171\u4eab\u7535\u52a8\u8f66\u8fd8\u6ca1\u6709\u5f52\u8fd8\uff0c\u4e00\u4ee3\u67ad\u96c4\u5c31\u6b64\u542b\u6068\u800c\u7ec8\u3002\u4ed6\u672c\u6765\u8981\u518d\u5938\u8d5e\u9aa1\u5b50\u5929\u738b\u4e00\u53e5\uff0c\u5938\u5979\u6709\u521b\u9020\u529b\u5730\u63d0\u524d\u51c6\u5907\u4e86\u7ef3\u5b50\uff0c\u8ba9\u4ed6\u80fd\u9009\u62e9\u8fd9\u4e2a\u53e4\u8001\u7684\u3001\u4e0e\u65f6\u4ee3\u8131\u8282\u7684\u6b7b\u6cd5\u3002\u5426\u5219\uff0c\u53ea\u80fd\u662f\u7ed9\u7f51\u7ea2\u6865\u5e73\u6dfb\u4e1a\u7ee9\uff0c\u8fde\u540d\u5b57\u90fd\u4e0d\u4f1a\u51fa\u73b0\u5728\u4f17\u4eba\u4e4b\u53e3\u5427\u3002\u003c/p\u003e\n\u003cp\u003e\u9aa1\u5b50\u5929\u738b\u5173\u4e0a\u624b\u7535\u7b52\u3002\u5979\u4e0a\u5348\u751f\u5b69\u5b50\uff0c\u4e0b\u5348\u629b\u5b69\u5b50\uff0c\u665a\u4e0a\u9009\u62e9\u6765\u5b9e\u73b0\u8df3\u821e\u60c5\u4eba\u7684\u7406\u60f3\u3002\u80e1\u8a00\u4e71\u8bed\uff0c\u52a0\u4e0a\u4e24\u7bb1\u54c8\u5c14\u6ee8\u5564\u9152\uff0c\u62ab\u4e0a\u9ec4\u8272\u5927\u8863\u3001\u9177\u4f3c\u9aa1\u5b50\u76ae\uff0c\u5373\u4f7f\u662f\u4e00\u4e2a\u65b0\u65f6\u4ee3\u5973\u5b50\uff0c\u6709\u6587\u5316\uff0c\u4f1a\u8bfb\u8bd7\uff0c\u4e5f\u89c9\u5f97\u81ea\u5df1\u4e0e\u90a3\u9edd\u9ed1\u5a01\u6b66\u7684\u5409\u7965\u5929\u5973\u6709\u8054\u7cfb\u4e86\u3002\u5979\u626b\u4e86\u5171\u4eab\u7535\u52a8\u8f66\uff0c\u663e\u793a\u5f53\u524d\u5df2\u6709\u5176\u4ed6\u4eba\uff0c\u4e8e\u662f\u4fbf\u7aef\u5750\u5728\u6b63\u6bbf\uff0c\u671f\u5f85\u81ea\u5df1\u505a\u7684\u4e00\u5207\u80fd\u6210\u4e3a\u5934\u9aa8\u7897\u6cfc\u51fa\u53bb\u7684\u5e78\u798f\u9c9c\u8840\uff0c\u6210\u4e3a\u666e\u7f57\u5927\u4f17\u8336\u4f59\u996d\u540e\u7684\u6d88\u9063\uff0c\u5fc3\u60c5\u5982\u540c\u6daa\u9675\u69a8\u83dc\u7684\u521b\u59cb\u4eba\u90b1\u5bff\u5b89\u3002\u5979\u60f3\u8c61\u660e\u5929\u8fd9\u91cc\u8dea\u62dc\u7684\u65e0\u6570\u5584\u7537\u4fe1\u5973\uff0c\u4fbf\u5982\u662f\u8bf4\uff1a\u201c\u4e3a\u5f7c\u6709\u60c5\u5df2\u4e8e\u65e0\u91cf\u767e\u5343\u4f5b\u6240\u79cd\u5584\u6839\u8005\u3002\u5e38\u4f7f\u5f97\u95fb\u4e0d\u901f\u9690\u6ca1\u3002\u590d\u4e8e\u65e0\u91cf\u767e\u5343\u4ebf\u52ab\u3002\u5f53\u53d7\u4eba\u5929\u79cd\u79cd\u80dc\u4e50\u3002\u201d\u003c/p\u003e", "order": 2.0, "title": "\u5173\u4e8e\u5904\u7406\u65b0\u751f\u513f\u4e0e\u5e2e\u52a9\u9aa1\u5b50\u5929\u738b\u7684\u8bf8\u4e8b\u4e91\u4e91"}, {"html": "\u003cp\u003e\u51cc\u6668\u4e24\u70b9\uff0c\u98de\u673a\u5728\u4e91\u4e0a\u98de\u3002\u90bb\u5ea7\u7684\u5973\u5b69\u4e00\u76f4\u5728\u5199\u4e1c\u897f\uff0c\u7528\u4e00\u652f\u5f88\u77ed\u7684\u94c5\u7b14\uff0c\u5199\u4e00\u4f1a\u513f\u5c31\u505c\u4e0b\uff0c\u628a\u7eb8\u7ffb\u8fc7\u53bb\u538b\u5728\u5c0f\u684c\u677f\u4e0a\u3002\u6211\u5047\u88c5\u7761\u89c9\uff0c\u5176\u5b9e\u4e00\u76f4\u5728\u770b\u5979\u624b\u8155\u4e0a\u90a3\u6839\u892a\u8272\u7684\u7ea2\u7ef3\u3002\u003c/p\u003e\n\u003cp\u003e\u5feb\u964d\u843d\u7684\u65f6\u5019\u5979\u7ec8\u4e8e\u5f00\u53e3\uff0c\u95ee\u6211\u80fd\u4e0d\u80fd\u5e2e\u5979\u770b\u4e00\u773c\u3002\u7eb8\u4e0a\u662f\u4e00\u6bb5\u5f88\u77ed\u7684\u8bdd\uff1a\u5982\u679c\u660e\u5929\u5929\u6c14\u597d\uff0c\u6211\u5c31\u53bb\u628a\u5934\u53d1\u526a\u77ed\uff0c\u7136\u540e\u544a\u8bc9\u4ed6\u6211\u5176\u5b9e\u65e9\u5c31\u77e5\u9053\u4e86\u3002\u5979\u8bf4\u8fd9\u662f\u7ed9\u4e09\u5e74\u540e\u7684\u81ea\u5df1\u5199\u7684\uff0c\u88c5\u8fdb\u4fe1\u5c01\uff0c\u4ea4\u7ed9\u673a\u573a\u7684\u5931\u7269\u62db\u9886\u5904\uff0c\u4e09\u5e74\u540e\u53bb\u53d6\u3002\u003c/p\u003e\n\u003cp\u003e\u6211\u95ee\u5979\uff0c\u5982\u679c\u4e09\u5e74\u540e\u90a3\u5bb6\u5931\u7269\u62db\u9886\u5904\u5df2\u7ecf\u642c\u8d70\u4e86\u5462\u3002\u5979\u60f3\u4e86\u60f3\u8bf4\uff0c\u90a3\u5c31\u5f53\u6ca1\u5199\u8fc7\u3002\u5979\u8bf4\u8fd9\u8bdd\u7684\u65f6\u5019\u98de\u673a\u5f00\u59cb\u4e0b\u964d\uff0c\u7a97\u5916\u7684\u4e91\u88ab\u57ce\u5e02\u7684\u5149\u7167\u5f97\u5f88\u767d\u3002\u003c/p\u003e\n\u003cp\u003e\u843d\u5730\u4e4b\u540e\u6211\u4eec\u5728\u884c\u674e\u8f6c\u76d8\u524d\u9762\u5206\u5f00\u3002\u5979\u8d70\u5f97\u5f88\u6025\uff0c\u7ea2\u7ef3\u5728\u8896\u53e3\u5916\u9762\u6643\u4e86\u4e00\u4e0b\u5c31\u4e0d\u89c1\u4e86\u3002\u6211\u7ad9\u5728\u539f\u5730\u7b49\u7bb1\u5b50\uff0c\u5ffd\u7136\u5f88\u60f3\u77e5\u9053\uff0c\u90a3\u5c01\u4fe1\u73b0\u5728\u5728\u54ea\u513f\u3002\u003c/p\u003e", "order": 3.0, "title": "\u591c\u822a"}];
